name: Managed update isolated Windows validation

on:
  pull_request:

permissions:
  contents: read

jobs:
  windows-managed-update-short:
    name: Windows managed update short verification (no real install)
    if: github.head_ref == 'feature/managed-app-update-install' || github.ref == 'refs/heads/feature/managed-app-update-install'
    runs-on: windows-2022
    timeout-minutes: 8
    steps:
      - name: Check out exact independent candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up locked Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.18.1
      - name: Verify real Windows handles and controlled asInvoker handoff
        shell: pwsh
        env:
          ETE_EXPECTED_SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
          ETE_DIAGNOSTIC_NO_WIZARD: '1'
          ETE_DIAGNOSTIC_FOCUS: '1'
          ETE_DIAGNOSTIC_CASE: lifecycle
        run: node tools/verify-managed-update-windows.cjs --expected-source $env:ETE_EXPECTED_SOURCE
      - name: Upload bounded independent validation receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: managed-update-windows-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-output/managed-update-windows/*
          if-no-files-found: error
          retention-days: 1
          include-hidden-files: false
