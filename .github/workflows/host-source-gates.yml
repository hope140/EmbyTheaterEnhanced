name: Source Host compile and verification gates
on:
  push:
    branches: [fix/host-electron-exit-v043]
    paths:
      - .github/workflows/host-source-gates.yml
      - tools/test-host-source-gates.ps1
      - tools/windows-host-verifier/expected-candidate-files.json
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-host-gates:
    if: github.ref == 'refs/heads/fix/host-electron-exit-v043' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.1
      - name: Compile actual Host and run all production verification and staging gates
        shell: pwsh
        run: ./tools/test-host-source-gates.ps1 -OutputRoot (Join-Path $env:RUNNER_TEMP ('host-source-gates-' + $env:GITHUB_RUN_ID))
      - name: Preserve bounded result only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: host-source-gates-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/host-source-gates-${{ github.run_id }}/host-source-gates.json
          if-no-files-found: warn
          retention-days: 1
