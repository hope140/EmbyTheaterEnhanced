name: Manual verified release

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Verify runs read-only checks; publish explicitly creates a new Release
        required: true
        type: choice
        default: verify
        options: [verify, publish]
      tag:
        description: Existing version tag (vX.Y.Z); this workflow never creates or moves tags
        required: true
        type: string
      source_sha:
        description: Exact 40-character source commit already contained in main
        required: true
        type: string
      channel:
        description: Testing preserves Latest; stable explicitly replaces the expected Latest
        required: true
        type: choice
        default: testing
        options: [testing, stable]
      expected_latest_tag:
        description: Current official Latest tag, or NONE if no official release exists
        required: true
        type: string
      verified_build_run:
        description: Optional successful public-ci manual release build run; blank rebuilds the pinned source
        required: false
        type: string
        default: ''

permissions:
  contents: read

# Serialize both channels. External/manual releases are additionally checked
# before draft creation, before publication, and on readback.
concurrency:
  group: ete-verified-release
  cancel-in-progress: false

jobs:
  preflight:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'hope140/EmbyTheaterEnhanced' && startsWith(github.ref, 'refs/heads/') && (inputs.mode == 'verify' || (inputs.mode == 'publish' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      existing_release_id: ${{ steps.plan.outputs.existing_release_id }}
      source: ${{ steps.plan.outputs.source }}
      tag: ${{ steps.plan.outputs.tag }}
      version: ${{ steps.plan.outputs.version }}
      channel: ${{ steps.plan.outputs.channel }}
      latest_id: ${{ steps.plan.outputs.latest_id }}
      latest_tag: ${{ steps.plan.outputs.latest_tag }}
      notes_sha256: ${{ steps.plan.outputs.notes_sha256 }}
      build_run: ${{ steps.plan.outputs.build_run }}
      build_attempt: ${{ steps.plan.outputs.build_attempt }}
      build_artifact: ${{ steps.plan.outputs.build_artifact }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.18.1
      - name: Validate exact source, channel and release state
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          ETE_RELEASE_MODE: ${{ inputs.mode }}
          ETE_RELEASE_TAG: ${{ inputs.tag }}
          ETE_RELEASE_SOURCE: ${{ inputs.source_sha }}
          ETE_RELEASE_CHANNEL: ${{ inputs.channel }}
          ETE_RELEASE_LATEST_TAG: ${{ inputs.expected_latest_tag }}
          ETE_RELEASE_BUILD_RUN: ${{ inputs.verified_build_run }}
        run: node tools/actions-release.cjs preflight

  build:
    needs: preflight
    runs-on: windows-2022
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.preflight.outputs.build_run == '0' && needs.preflight.outputs.source || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.18.1
      - name: Build and verify through the existing ETE release package path
        if: needs.preflight.outputs.build_run == '0'
        shell: pwsh
        env:
          ETE_RELEASE_SOURCE: ${{ needs.preflight.outputs.source }}
        run: ./tools/ci-windows-test-package.ps1 -ReleasePackage -ExpectedSourceCommit $env:ETE_RELEASE_SOURCE
      - name: Reuse only the explicitly selected verified release build
        if: needs.preflight.outputs.build_run != '0'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ETE_SOURCE_BUILD_RUN: ${{ needs.preflight.outputs.build_run }}
          ETE_SOURCE_BUILD_ARTIFACT: ${{ needs.preflight.outputs.build_artifact }}
        run: gh run download "$ETE_SOURCE_BUILD_RUN" --repo "$GITHUB_REPOSITORY" --name "$ETE_SOURCE_BUILD_ARTIFACT" --dir test-output/manual-windows-package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ete-release-${{ needs.preflight.outputs.source }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-output/manual-windows-package/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          include-hidden-files: false

  verify:
    if: inputs.mode == 'verify'
    needs: [preflight, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.18.1
      - name: Download only this run's verified package artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ETE_RELEASE_ARTIFACT: ete-release-${{ needs.preflight.outputs.source }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$ETE_RELEASE_ARTIFACT" --dir release-artifact
      - name: Verify files and remote state without creating or changing a Release
        env:
          GH_TOKEN: ${{ github.token }}
          ETE_RELEASE_MODE: verify
          ETE_RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
          ETE_RELEASE_SOURCE: ${{ needs.preflight.outputs.source }}
          ETE_RELEASE_CHANNEL: ${{ needs.preflight.outputs.channel }}
          ETE_RELEASE_LATEST_TAG: ${{ needs.preflight.outputs.latest_tag }}
          ETE_RELEASE_LATEST_ID: ${{ needs.preflight.outputs.latest_id }}
          ETE_RELEASE_EXISTING_ID: ${{ needs.preflight.outputs.existing_release_id }}
          ETE_RELEASE_NOTES_SHA256: ${{ needs.preflight.outputs.notes_sha256 }}
          ETE_RELEASE_BUILD_RUN: ${{ needs.preflight.outputs.build_run }}
          ETE_RELEASE_BUILD_ATTEMPT: ${{ needs.preflight.outputs.build_attempt }}
        run: node tools/actions-release.cjs verify release-artifact

  publish:
    if: inputs.mode == 'publish' && github.ref == 'refs/heads/main'
    needs: [preflight, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      # Execute only the dispatch/main tooling, never scripts from the artifact
      # or the separately checked-out build target, with this write token.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.18.1
      - name: Download only this run's verified package artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ETE_RELEASE_ARTIFACT: ete-release-${{ needs.preflight.outputs.source }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$ETE_RELEASE_ARTIFACT" --dir release-artifact
      - name: Verify five files, create a new draft, upload and publish
        env:
          GH_TOKEN: ${{ github.token }}
          ETE_RELEASE_MODE: publish
          ETE_RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
          ETE_RELEASE_SOURCE: ${{ needs.preflight.outputs.source }}
          ETE_RELEASE_CHANNEL: ${{ needs.preflight.outputs.channel }}
          ETE_RELEASE_LATEST_TAG: ${{ needs.preflight.outputs.latest_tag }}
          ETE_RELEASE_LATEST_ID: ${{ needs.preflight.outputs.latest_id }}
          ETE_RELEASE_NOTES_SHA256: ${{ needs.preflight.outputs.notes_sha256 }}
          ETE_RELEASE_BUILD_RUN: ${{ needs.preflight.outputs.build_run }}
          ETE_RELEASE_BUILD_ATTEMPT: ${{ needs.preflight.outputs.build_attempt }}
        run: node tools/actions-release.cjs publish release-artifact
