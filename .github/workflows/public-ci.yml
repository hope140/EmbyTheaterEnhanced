name: Public offline CI

on:
  pull_request:
  push:
  workflow_dispatch:
    inputs:
      release_package:
        description: Stage the standard installer name and five release files (does not publish)
        type: boolean
        default: false
      build_input_benchmark:
        description: Run short A/B only (0 unit tests; never builds a package)
        type: boolean
        default: false
      benchmark_expected_sha:
        description: Optional reviewed 40-hex SHA; must equal the selected branch dispatch SHA
        type: string
        default: ''
      benchmark_trials:
        description: Balanced A/B rounds per arm
        type: choice
        default: '4'
        options: ['4', '2', '6', '8']
      benchmark_warm_calls:
        description: Subsequent calls in each fresh process
        type: choice
        default: '3'
        options: ['3', '1', '5', '10']

      shared_cache_smoke:
        description: Run isolated shared-cache native smoke against an exact existing test artifact (no build)
        type: boolean
        default: false
      shared_cache_diagnostics:
        description: Run bounded per-file Windows TAP diagnostics only (no package or native helper)
        type: boolean
        default: false
      shared_cache_artifact_id:
        description: Exact unexpired successful manual-package artifact ID
        type: string
        default: ''
      shared_cache_zip_sha256:
        description: Reviewed artifact ZIP SHA256
        type: string
        default: ''
      shared_cache_installer_sha256:
        description: Reviewed installer SHA256 inside that artifact
        type: string
        default: ''

permissions:
  contents: read

jobs:
  windows-public-offline:
    if: github.event_name != 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # actions/setup-node v4.4.0
        with:
          node-version: 24.18.1

      - name: Classify complete event change range
        id: scope
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_PULL_REQUEST_BASE: ${{ github.event.pull_request.base.sha }}
          CI_PULL_REQUEST_HEAD: ${{ github.event.pull_request.head.sha }}
          CI_PUSH_BEFORE: ${{ github.event.before }}
          CI_PUSH_HEAD: ${{ github.event.after }}
        run: node tools/ci-change-scope.cjs

      - name: Check documentation format, local links and credential patterns
        id: docs
        if: steps.scope.outputs.mode == 'docs'
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_PULL_REQUEST_BASE: ${{ github.event.pull_request.base.sha }}
          CI_PULL_REQUEST_HEAD: ${{ github.event.pull_request.head.sha }}
          CI_PUSH_BEFORE: ${{ github.event.before }}
          CI_PUSH_HEAD: ${{ github.event.after }}
        run: node tools/ci-docs-check.cjs

      - name: Install locked JavaScript dependencies without lifecycle scripts
        if: steps.scope.outputs.mode != 'docs'
        run: npm ci --ignore-scripts

      - name: Inspect Windows temporary path identity
        if: steps.scope.outputs.mode != 'docs'
        run: node tools/ci-windows-path-diagnostics.cjs

      - name: Verify exact repository snapshot bytes
        if: steps.scope.outputs.mode != 'docs'
        run: node -e "for (const name of ['web-snapshot','compatibility-resources','small-runtime','model-compatibility']) require('./tools/'+name+'-input.cjs').validate(process.cwd()); console.log('All four repository snapshots match their manifests.');"

      - name: Verify committed original libmpv archive
        if: steps.scope.outputs.mode != 'docs'
        run: node tools/libmpv-input.cjs validate-archive .

      - name: Run public offline test set
        id: regression
        if: steps.scope.outputs.mode != 'docs'
        run: node tools/ci-public-tests.cjs

      - name: Check maintained JavaScript syntax
        if: steps.scope.outputs.mode != 'docs'
        run: node tools/ci-syntax.cjs

      - name: Check maintained PowerShell syntax
        if: steps.scope.outputs.mode != 'docs'
        shell: pwsh
        run: ./tools/ci-powershell-syntax.ps1

      - name: Check credentials patterns in maintained source
        if: steps.scope.outputs.mode != 'docs'
        run: node tools/ci-secret-scan.cjs

      - name: Check patch whitespace
        if: steps.scope.outputs.mode != 'docs'
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_PULL_REQUEST_BASE: ${{ github.event.pull_request.base.sha }}
          CI_PUSH_BEFORE: ${{ github.event.before }}
          CI_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: node tools/ci-diff-check.cjs

      - name: Report actual validation route
        if: always()
        env:
          CI_SCOPE_MODE: ${{ steps.scope.outputs.mode }}
          CI_DOCS_OUTCOME: ${{ steps.docs.outcome }}
          CI_TEST_OUTCOME: ${{ steps.regression.outcome }}
        run: node tools/ci-change-scope.cjs summary

  manual-windows-test-package:
    if: github.event_name == 'workflow_dispatch' && !inputs.build_input_benchmark && !inputs.shared_cache_smoke && !inputs.shared_cache_diagnostics
    # Keep the existing VS2022/MSBuild17 contract; windows-2025 now selects VS2026.
    runs-on: windows-2022
    timeout-minutes: 60
    concurrency:
      group: ete-manual-windows-test-package
      cancel-in-progress: false
    steps:
      - name: Check out exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up locked Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.18.1

      - name: Compile and verify source Host, then build test package from locked components
        shell: pwsh
        env:
          ETE_RELEASE_PACKAGE: ${{ inputs.release_package }}
        run: ./tools/ci-windows-test-package.ps1 -ReleasePackage:($env:ETE_RELEASE_PACKAGE -eq 'true')

      - name: Upload verified test package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ete-test-win-x64-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-output/manual-windows-package/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          include-hidden-files: false

  windows-build-input-benchmark:
    name: Windows build input A/B (0 unit tests)
    if: github.event_name == 'workflow_dispatch' && inputs.build_input_benchmark && !inputs.shared_cache_smoke && !inputs.shared_cache_diagnostics
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Require explicit benchmark mode and the reviewed source
        shell: pwsh
        env:
          AB_ENABLED: ${{ inputs.build_input_benchmark }}
          AB_RELEASE_PACKAGE: ${{ inputs.release_package }}
          AB_EXPECTED_SHA: ${{ inputs.benchmark_expected_sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:AB_ENABLED -ne 'true' -or $env:AB_RELEASE_PACKAGE -eq 'true') {
            throw 'Benchmark mode requires build_input_benchmark=true and release_package=false; no package fallback.'
          }
          if ($env:AB_EXPECTED_SHA -and $env:AB_EXPECTED_SHA -cne $env:GITHUB_SHA) {
            throw 'Reviewed benchmark SHA differs from this dispatch SHA.'
          }
          $scope = "Build input A/B only. Unit tests: 0. Existing public CI regression is still required. Source: $env:GITHUB_SHA"
          Write-Host $scope
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value $scope

      - name: Check out exact benchmark source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up locked Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.18.1

      - name: Measure same-input paired Git and fixture preparation
        shell: pwsh
        env:
          AB_EXPECTED_SHA: ${{ inputs.benchmark_expected_sha || github.sha }}
          AB_TRIALS: ${{ inputs.benchmark_trials }}
          AB_WARM_CALLS: ${{ inputs.benchmark_warm_calls }}
        run: |
          $benchmarkOutput = Join-Path $env:RUNNER_TEMP ('ci-input-ab-' + $env:GITHUB_RUN_ID + '-' + $env:GITHUB_RUN_ATTEMPT)
          ./tools/benchmark-build-inputs-windows.ps1 -ExpectedSourceCommit $env:AB_EXPECTED_SHA -OutputRoot $benchmarkOutput -Trials ([int]$env:AB_TRIALS) -WarmCalls ([int]$env:AB_WARM_CALLS)

      - name: Upload bounded benchmark diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: build-input-ab-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-input-ab-${{ github.run_id }}-${{ github.run_attempt }}/artifact
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          include-hidden-files: false


  windows-shared-cache-smoke:
    if: github.event_name == 'workflow_dispatch' && inputs.shared_cache_smoke && !inputs.shared_cache_diagnostics
    runs-on: windows-2022
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    concurrency:
      group: ete-shared-cache-native-smoke
      cancel-in-progress: false
    steps:
      - name: Require isolated smoke mode and exact reviewed tool source
        shell: pwsh
        env:
          SMOKE_BENCHMARK: ${{ inputs.build_input_benchmark }}
          SMOKE_RELEASE: ${{ inputs.release_package }}
          SMOKE_TOOL_SHA: ${{ inputs.benchmark_expected_sha }}
        run: |
          if ($env:SMOKE_BENCHMARK -eq 'true' -or $env:SMOKE_RELEASE -eq 'true' -or $env:SMOKE_TOOL_SHA -cnotmatch '^[a-f0-9]{40}$' -or $env:SMOKE_TOOL_SHA -cne $env:GITHUB_SHA) { throw 'Shared cache smoke requires exact reviewed tooling SHA with build, release and benchmark modes disabled.' }
      - name: Check out exact smoke tooling source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up locked Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.1
      - name: Install locked fixture dependencies without scripts
        run: npm ci --ignore-scripts
      - name: Run exact-artifact owned Windows shared cache smoke
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SMOKE_ARTIFACT_ID: ${{ inputs.shared_cache_artifact_id }}
          SMOKE_ZIP_SHA: ${{ inputs.shared_cache_zip_sha256 }}
          SMOKE_INSTALLER_SHA: ${{ inputs.shared_cache_installer_sha256 }}
          SMOKE_TOOL_SHA: ${{ inputs.benchmark_expected_sha }}
        run: |
          $out = Join-Path $env:RUNNER_TEMP ('ete-shared-smoke-' + $env:GITHUB_RUN_ID + '-' + $env:GITHUB_RUN_ATTEMPT)
          ./tools/shared-playback-cache/windows-ci.ps1 -ArtifactId $env:SMOKE_ARTIFACT_ID -ZipSha256 $env:SMOKE_ZIP_SHA -InstallerSha256 $env:SMOKE_INSTALLER_SHA -ExpectedToolSha $env:SMOKE_TOOL_SHA -OutputRoot $out
      - name: Upload only safe shared cache receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: shared-cache-smoke-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ete-shared-smoke-${{ github.run_id }}-${{ github.run_attempt }}/safe-receipts/*
          if-no-files-found: warn
          retention-days: 1
          compression-level: 0
          include-hidden-files: false


  windows-shared-cache-diagnostics:
    if: github.event_name == 'workflow_dispatch' && inputs.shared_cache_diagnostics
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - name: Require reviewed offline diagnostic mode only
        shell: pwsh
        env:
          DIAG_NATIVE: ${{ inputs.shared_cache_smoke }}
          DIAG_BENCHMARK: ${{ inputs.build_input_benchmark }}
          DIAG_RELEASE: ${{ inputs.release_package }}
          DIAG_TOOL_SHA: ${{ inputs.benchmark_expected_sha }}
        run: |
          if ($env:DIAG_NATIVE -eq 'true' -or $env:DIAG_BENCHMARK -eq 'true' -or $env:DIAG_RELEASE -eq 'true' -or $env:DIAG_TOOL_SHA -cnotmatch '^[a-f0-9]{40}$' -or $env:DIAG_TOOL_SHA -cne $env:GITHUB_SHA) { throw 'Offline diagnostics require exact tooling SHA and no native, package or benchmark mode.' }
      - name: Check out exact diagnostic source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up locked Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.1
      - name: Install locked offline fixture dependencies
        run: npm ci --ignore-scripts
      - name: Emit first assertion immediately with finite per-file owned deadlines
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP ('ete-shared-diagnostics-' + $env:GITHUB_RUN_ID + '-' + $env:GITHUB_RUN_ATTEMPT)
          node tools/shared-playback-cache/windows-diagnostics.cjs "--out=$out"
          if ($LASTEXITCODE -ne 0) { throw 'Offline Windows diagnostics failed; inspect first TAP assertion, not a longer timeout.' }
      - name: Upload owned synthetic TAP and diagnostic summary
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: shared-cache-diagnostics-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ete-shared-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}/*
          if-no-files-found: warn
          retention-days: 1
          compression-level: 0
          include-hidden-files: false
