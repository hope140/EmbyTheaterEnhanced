name: Public offline CI

on:
  pull_request:
  push:
  workflow_dispatch:
    inputs:
      range_smoke:
        description: Isolated fixed-candidate range smoke; off preserves package behavior
        type: choice
        default: 'off'
        options:
          - 'off'
          - entry
          - native
          - loader-trial
          - disk-probe
          - disk-results
      release_package:
        description: Stage the standard installer name and five release files (does not publish)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  windows-public-offline:
    if: github.event_name != 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # actions/setup-node v4.4.0
        with:
          node-version: 24.18.1

      - name: Classify complete event change range
        id: scope
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_PULL_REQUEST_BASE: ${{ github.event.pull_request.base.sha }}
          CI_PULL_REQUEST_HEAD: ${{ github.event.pull_request.head.sha }}
          CI_PUSH_BEFORE: ${{ github.event.before }}
          CI_PUSH_HEAD: ${{ github.event.after }}
        run: node tools/ci-change-scope.cjs

      - name: Check documentation format, local links and credential patterns
        id: docs
        if: steps.scope.outputs.mode == 'docs'
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_PULL_REQUEST_BASE: ${{ github.event.pull_request.base.sha }}
          CI_PULL_REQUEST_HEAD: ${{ github.event.pull_request.head.sha }}
          CI_PUSH_BEFORE: ${{ github.event.before }}
          CI_PUSH_HEAD: ${{ github.event.after }}
        run: node tools/ci-docs-check.cjs

      - name: Install locked JavaScript dependencies without lifecycle scripts
        if: steps.scope.outputs.mode != 'docs'
        run: npm ci --ignore-scripts

      - name: Inspect Windows temporary path identity
        if: steps.scope.outputs.mode != 'docs'
        run: node tools/ci-windows-path-diagnostics.cjs

      - name: Verify exact repository snapshot bytes
        if: steps.scope.outputs.mode != 'docs'
        run: node -e "for (const name of ['web-snapshot','compatibility-resources','small-runtime','model-compatibility']) require('./tools/'+name+'-input.cjs').validate(process.cwd()); console.log('All four repository snapshots match their manifests.');"

      - name: Verify committed original libmpv archive
        if: steps.scope.outputs.mode != 'docs'
        run: node tools/libmpv-input.cjs validate-archive .

      - name: Run public offline test set
        id: regression
        if: steps.scope.outputs.mode != 'docs'
        run: node tools/ci-public-tests.cjs

      - name: Check maintained JavaScript syntax
        if: steps.scope.outputs.mode != 'docs'
        run: node tools/ci-syntax.cjs

      - name: Check maintained PowerShell syntax
        if: steps.scope.outputs.mode != 'docs'
        shell: pwsh
        run: ./tools/ci-powershell-syntax.ps1

      - name: Check credentials patterns in maintained source
        if: steps.scope.outputs.mode != 'docs'
        run: node tools/ci-secret-scan.cjs

      - name: Check patch whitespace
        if: steps.scope.outputs.mode != 'docs'
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_PULL_REQUEST_BASE: ${{ github.event.pull_request.base.sha }}
          CI_PUSH_BEFORE: ${{ github.event.before }}
          CI_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: node tools/ci-diff-check.cjs

      - name: Report actual validation route
        if: always()
        env:
          CI_SCOPE_MODE: ${{ steps.scope.outputs.mode }}
          CI_DOCS_OUTCOME: ${{ steps.docs.outcome }}
          CI_TEST_OUTCOME: ${{ steps.regression.outcome }}
        run: node tools/ci-change-scope.cjs summary

  manual-playback-range-smoke:
    if: github.event_name == 'workflow_dispatch' && (inputs.range_smoke == 'entry' || inputs.range_smoke == 'native' || inputs.range_smoke == 'loader-trial' || inputs.range_smoke == 'disk-probe')
    runs-on: windows-2022
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    concurrency:
      group: ete-manual-playback-range-smoke
      cancel-in-progress: false
    steps:
      - name: Check out exact workflow controls
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          path: range-controls
          fetch-depth: 0
          persist-credentials: false

      - name: Check out immutable validated smoke tools
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: c9cd9bacf81445c9c10befd121951b1c63c86faa
          path: range-tools
          fetch-depth: 0
          persist-credentials: false

      - name: Set up locked Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.18.1

      - name: Create owned fixed-candidate control plan
        shell: pwsh
        env:
          ETE_RANGE_MODE: ${{ inputs.range_smoke }}
          ETE_RELEASE_PACKAGE: ${{ inputs.release_package }}
        run: |
          $root = Join-Path $env:RUNNER_TEMP "ete-range-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          node range-controls/tools/ci-playback-range-smoke.cjs plan "--tools=$env:GITHUB_WORKSPACE/range-tools" "--root=$root" "--mode=$env:ETE_RANGE_MODE"
          if ($LASTEXITCODE -ne 0) { throw 'Range control preflight failed.' }

      - name: Download only exact candidate ZIP and fixed unpacker
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $root = Join-Path $env:RUNNER_TEMP "ete-range-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          node range-controls/tools/ci-playback-range-smoke.cjs acquire "--plan=$root/control-plan.json"
          if ($LASTEXITCODE -ne 0) { throw 'Fixed input unavailable or refused; no substitute/rebuild.' }

      - name: Statically extract verified installer with locked unpacker
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP "ete-range-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          ./range-controls/tools/ci-playback-range-unpack.ps1 -PlanPath "$root/control-plan.json"
          if (-not $?) { throw 'Controlled static extraction failed.' }

      - name: Run explicit entry and selected synthetic native scope
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP "ete-range-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          node range-controls/tools/ci-playback-range-smoke.cjs execute "--plan=$root/control-plan.json"
          if ($LASTEXITCODE -ne 0) { throw 'Range evidence failed; inspect receipts.' }

      - name: Collect only bounded owned receipts
        if: always()
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP "ete-range-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $out = Join-Path $env:GITHUB_WORKSPACE 'range-smoke-evidence'
          if (Test-Path -LiteralPath "$root/control-plan.json") {
            node range-controls/tools/ci-playback-range-smoke.cjs collect "--plan=$root/control-plan.json" "--out=$out"
            if ($LASTEXITCODE -ne 0) { throw 'Receipt collection failed.' }
          } else {
            New-Item -ItemType Directory -Path $out | Out-Null
            [IO.File]::WriteAllText((Join-Path $out 'not-started.json'), '{"status":"not-started","reason":"control-plan-unavailable"}')
          }

      - name: Upload isolated range receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ete-range-smoke-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: range-smoke-evidence/*
          if-no-files-found: error
          retention-days: 1
          include-hidden-files: false

  manual-windows-test-package:
    if: github.event_name == 'workflow_dispatch' && (inputs.range_smoke == 'off' || inputs.range_smoke == '')
    # Keep the existing VS2022/MSBuild17 contract; windows-2025 now selects VS2026.
    runs-on: windows-2022
    timeout-minutes: 60
    concurrency:
      group: ete-manual-windows-test-package
      cancel-in-progress: false
    steps:
      - name: Check out exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up locked Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.18.1

      - name: Compile and verify source Host, then build test package from locked components
        shell: pwsh
        env:
          ETE_RELEASE_PACKAGE: ${{ inputs.release_package }}
        run: ./tools/ci-windows-test-package.ps1 -ReleasePackage:($env:ETE_RELEASE_PACKAGE -eq 'true')

      - name: Upload verified test package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ete-test-win-x64-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-output/manual-windows-package/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          include-hidden-files: false

  manual-mpv-disk-results:
    if: github.event_name == 'workflow_dispatch' && inputs.range_smoke == 'disk-results'
    runs-on: windows-2022
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    concurrency:
      group: ete-manual-playback-range-smoke
      cancel-in-progress: false
    steps:
      - name: Check out exact receipt reader
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Set up locked Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.18.1

      - name: Read only fixed completed disk experiment artifact
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ETE_RELEASE_PACKAGE: ${{ inputs.release_package }}
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "ete-disk-results-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT.zip"
          node tools/ci-mpv-disk-results.cjs download "--zip=$zip"
          if ($LASTEXITCODE -ne 0) { throw 'Fixed disk result artifact unavailable or refused.' }

      - name: Print bounded file lifecycle and source range evidence
        shell: pwsh
        run: |
          foreach ($name in @('GITHUB_TOKEN','GH_TOKEN','GH_ENTERPRISE_TOKEN','ACTIONS_RUNTIME_TOKEN','ACTIONS_ID_TOKEN_REQUEST_TOKEN')) {
            Remove-Item -LiteralPath ('Env:' + $name) -ErrorAction SilentlyContinue
          }
          $zip = Join-Path $env:RUNNER_TEMP "ete-disk-results-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT.zip"
          node tools/ci-mpv-disk-results.cjs summarize "--zip=$zip"
          if ($LASTEXITCODE -ne 0) { throw 'Disk result evidence was not established.' }
