name: v0.4.3 existing installer startup check
on:
  push:
    branches: [validation/v043-installed-startup]
    paths: [tools/v043-installed-startup-input.json]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  installed-startup:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - name: Check out independent validation only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            tools/check-v043-installed-startup.ps1
            tools/v043-installed-startup-input.json
      - name: Check pure contracts without installation
        shell: pwsh
        run: ./tools/check-v043-installed-startup.ps1 -ContractSelfTest
      - name: Read reviewed attachment binding
        id: binding
        shell: pwsh
        run: |
          $checkInput = Get-Content -LiteralPath tools/v043-installed-startup-input.json -Raw | ConvertFrom-Json
          if ($checkInput.enabled -isnot [bool]) { throw 'Boolean enable flag required.' }
          if ($checkInput.enabled) {
            if ([string]$checkInput.artifactId -notmatch '^[1-9][0-9]{0,15}$' -or [string]$checkInput.artifactZipSha256 -cnotmatch '^[a-f0-9]{64}$' -or [string]$checkInput.installerSha256 -cnotmatch '^[a-f0-9]{64}$') { throw 'Exact reviewed artifact binding required.' }
            'enabled=true' >> $env:GITHUB_OUTPUT
          } else {
            'enabled=false' >> $env:GITHUB_OUTPUT
            Write-Output 'UNBOUND: no artifact download, installation or client launch.'
          }
      - name: Install original attachment and check ordinary Host startup and close
        if: steps.binding.outputs.enabled == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $checkInput = Get-Content -LiteralPath tools/v043-installed-startup-input.json -Raw | ConvertFrom-Json
          ./tools/check-v043-installed-startup.ps1 -ArtifactId $checkInput.artifactId -ArtifactZipSha256 $checkInput.artifactZipSha256 -InstallerSha256 $checkInput.installerSha256
      - name: Preserve bounded result only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: v043-installed-startup-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/v043-installed-${{ github.run_id }}-${{ github.run_attempt }}/report/*.json
          if-no-files-found: warn
          retention-days: 1
