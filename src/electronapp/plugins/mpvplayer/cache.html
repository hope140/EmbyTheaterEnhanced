<div is="emby-scroller" class="view flex flex-direction-column scrollFrameY flex-grow" data-mousewheel="true" data-horizontal="false" data-forcescrollbar="true" data-centerfocus="card" data-bindheader="true">
  <div class="scrollSlider flex-grow padded-left padded-left-page padded-right padded-top-page settingsContainer ete-settings-page">
    <header class="ete-settings-header"><h1>播放缓存与预载</h1><p>保留最后一次实际播放视频的已缓存部分，停止和退出后可继续使用；另一视频实际开始播放后清理旧缓存。未播放的下一集预载在退出时丢弃。</p></header>
    <form class="ete-cache-form">
      <p class="fieldDescription">播放缓存容量规则尚待确定，当前不可开启。可先保存以下已确认的预载选项；不需要填写限速。</p>
      <div hidden><input is="emby-checkbox" type="checkbox" class="chkRangeEnabled" disabled></div>
      <div class="selectContainer"><select is="emby-select" class="selectRangeProgress" label="播放到多少时预载下一集"><option value="50">50%</option><option value="60">60%</option><option value="70">70%</option><option value="80">80%</option><option value="90">90%</option></select></div>
      <div class="selectContainer"><select is="emby-select" class="selectRangePreload" label="下一集预载量"><option value="100">100 MB</option><option value="300">300 MB</option><option value="500">500 MB</option></select><div class="fieldDescription">只对播放队列中明确的同剧集下一集预载，达到所选进度后开始；当前播放优先。切集、账号或播放来源变化会取消旧任务。</div></div>
      <p class="secondaryText">部分流媒体、转码、跳转或需要其他授权方式的来源会沿原播放，不保证能使用磁盘缓存。</p>
      <button is="emby-button" type="submit" class="raised button-submit btnSaveRange">保存预载选项</button>
      <div class="rangeSettingsState ete-settings-status secondaryText" role="status" aria-live="polite"></div>
    </form>
    <section class="ete-settings-section"><h2>当前运行</h2><p class="rangeRuntimeState secondaryText" role="status" aria-live="polite">正在读取状态…</p><p class="secondaryText">播放中的“播放信息”可查看当前视频缓存和下一集预载状态。</p></section>
  </div>
</div>
