<div is="emby-scroller" class="view flex flex-direction-column scrollFrameY flex-grow" data-mousewheel="true" data-horizontal="false" data-forcescrollbar="true" data-centerfocus="card" data-bindheader="true">
    <div class="scrollSlider flex-grow flex-direction-column padded-left padded-left-page padded-right padded-top-page padded-bottom-page settingsContainer ete-settings-page diagnostics-settings-page ete-diagnostics-settings">
        <header class="ete-settings-header ete-diagnostics-hero" aria-label="诊断与日志说明">
            <p>查看日志状态、导出诊断报告或打开日志目录。</p>
        </header>

        <section class="ete-settings-section verticalSection ete-diagnostics-panel" aria-labelledby="ete-diagnostics-mode-title">
            <div class="ete-settings-section-header"><h2 id="ete-diagnostics-mode-title" class="sectionTitle">诊断级别</h2></div>
            <div class="ete-settings-card">
                <div class="selectContainer">
                    <select is="emby-select" class="selectDiagnosticMode" label="日志级别" aria-describedby="diagnosticModeDescription" disabled>
                        <option value="normal">普通</option><option value="detailed">详细</option>
                    </select>
                </div>
                <p id="diagnosticModeDescription" class="fieldDescription">普通模式保留必要错误；详细模式额外记录每次播放开始时最多 15 秒的信息。保存后下一次播放生效，不影响当前播放。</p>
                <p class="fieldDescription">日志会自动脱敏，但仍可能包含服务器地址、媒体文件路径和错误信息。分享前请检查内容。</p>
                <button type="button" is="emby-button" class="raised button-submit ete-settings-button ete-settings-button--primary btnSaveDiagnosticMode" disabled>保存诊断级别</button>
            </div>
        </section>

        <section class="ete-settings-section verticalSection ete-diagnostics-panel" aria-labelledby="ete-diagnostics-status-title">
            <div class="ete-settings-section-header">
                <div><h2 id="ete-diagnostics-status-title" class="sectionTitle">状态</h2></div>
            </div>
            <div class="ete-settings-card">
                <div class="ete-settings-info-row ete-diagnostics-row"><span>诊断日志</span><strong class="diagnosticsEnabled">已启用</strong></div>
                <div class="ete-settings-info-row ete-diagnostics-row"><span>日志目录</span><code class="diagnosticsDirectory">%APPDATA%\EmbyTheaterEnhanced\logs</code></div>
                <div class="ete-settings-info-row ete-diagnostics-row"><span>当前日志大小</span><span class="diagnosticsSize">未知</span></div>
                <p class="fieldDescription">日志记录播放来源、错误和必要的运行环境信息。</p>
            </div>
        </section>

        <section class="ete-settings-section verticalSection ete-diagnostics-panel" aria-labelledby="ete-diagnostics-actions-title">
            <div class="ete-settings-section-header">
                <div><h2 id="ete-diagnostics-actions-title" class="sectionTitle">操作</h2></div>
            </div>
            <div class="ete-settings-card">
                <div class="ete-settings-actions ete-diagnostics-actions">
                    <button type="button" is="emby-button" class="raised button-submit ete-settings-button ete-settings-button--primary btnExportDiagnostics">导出诊断日志</button>
                    <button type="button" is="emby-button" class="raised ete-settings-button ete-settings-button--secondary btnOpenDiagnostics">打开日志目录</button>
                    <button type="button" is="emby-button" class="button-link ete-settings-button ete-settings-button--danger btnClearDiagnostics">清空日志</button>
                </div>
                <div class="ete-settings-status diagnosticsState secondaryText" role="status" aria-live="polite"></div>
            </div>
        </section>
    </div>
</div>
