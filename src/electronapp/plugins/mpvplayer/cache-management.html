<div is="emby-scroller" class="view flex flex-direction-column scrollFrameY flex-grow" data-mousewheel="true" data-horizontal="false" data-forcescrollbar="true" data-centerfocus="card" data-bindheader="true">
    <div class="scrollSlider flex-grow flex-direction-column padded-left padded-left-page padded-right padded-top-page padded-bottom-page settingsContainer ete-settings-page cacheManagementPage">
        <section class="ete-settings-card cacheRows" aria-label="缓存分类">
            <div class="cacheRow cacheRowHead" aria-hidden="true"><span>名称</span><span>大小</span><span>操作</span></div>
            <div class="cacheRow" role="group" aria-labelledby="ete-cache-http-title">
                <h2 id="ete-cache-http-title" class="cacheName">资源缓存</h2>
                <span class="cacheHttpValue">尚未读取</span>
                <button type="button" is="emby-button" class="raised ete-settings-button btnClearHttpCache" aria-label="清理资源缓存">清理</button>
                <div class="ete-settings-status cacheHttpState" role="status" aria-live="polite"></div>
            </div>
            <div class="cacheRow" role="group" aria-labelledby="ete-cache-layout-title">
                <h2 id="ete-cache-layout-title" class="cacheName">页面缓存</h2>
                <span class="cachePageValue">尚未读取</span>
                <button type="button" is="emby-button" class="raised ete-settings-button btnClearPageCache" aria-label="清理页面缓存">清理</button>
                <p class="cachePageBudget" hidden></p>
                <div class="ete-settings-status cachePageState" role="status" aria-live="polite"></div>
            </div>
        </section>
        <div class="ete-settings-actions cacheActions">
            <button type="button" is="emby-button" class="raised ete-settings-button btnClearAllCaches">清理全部</button>
            <button type="button" is="emby-button" class="raised ete-settings-button btnRefreshCache">刷新</button>
        </div>
        <p class="cacheSafetyNote">资源为 HTTP 总量，页面为数据大小。不清登录和设置。</p>
        <div class="ete-settings-status cacheOperationState" role="status" aria-live="polite"></div>
    </div>
</div>
