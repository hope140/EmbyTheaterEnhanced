<div is="emby-scroller" class="view flex flex-direction-column scrollFrameY flex-grow" data-mousewheel="true" data-horizontal="false" data-forcescrollbar="true" data-bindheader="true">
    <div class="scrollSlider flex-grow flex-direction-column padded-left padded-left-page padded-right padded-top-page padded-bottom-page settingsContainer ete-settings-page ete-download-management">
        <section class="ete-settings-card downloadLocationCard">
            <h2>保存位置</h2>
            <p class="downloadDirectory downloadPath">尚未选择目录，首次下载时会提示选择。</p>
            <div class="downloadActions">
                <button type="button" is="emby-button" class="raised ete-settings-button btnDownloadDirectory">选择 / 更改目录</button>
                <button type="button" is="emby-button" class="raised ete-settings-button btnOpenDownloadDirectory">打开文件夹</button>
            </div>
            <p class="downloadHint">更改目录仅影响新任务，已有任务和文件位置不变。退出后停止下载，下次登录后继续。</p>
        </section>
        <section class="ete-settings-card">
            <div class="downloadListHeader"><h2>下载任务 <span class="downloadCount"></span></h2></div>
            <div class="downloadActions downloadToolbar">
                <div class="downloadQueueActions">
                    <button type="button" is="emby-button" class="raised ete-settings-button btnPauseAllDownloads">全部暂停</button>
                    <button type="button" is="emby-button" class="raised ete-settings-button btnResumeAllDownloads">全部继续</button>
                </div>
                <div class="downloadSelectionActions">
                    <span class="downloadSelectionCount"></span>
                    <button type="button" is="emby-button" class="raised ete-settings-button btnRemoveSelectedDownloads" disabled>删除所选</button>
                    <label class="downloadSelectAll"><input type="checkbox" class="chkSelectAllDownloads"><span>全选</span></label>
                </div>
            </div>
            <p class="downloadHint">默认只删除记录、保留文件；确认时可选择永久删除任务文件。</p>
            <div class="downloadTasks"></div>
        </section>
        <div class="downloadStatus ete-settings-status" role="status" aria-live="polite"></div>
    </div>
</div>
