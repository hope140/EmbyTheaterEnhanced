<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'self'">
  <title>Helper Composition Gate Overlay</title>
  <style>
    :root { color-scheme: dark; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: transparent; color: white; font: 15px system-ui, sans-serif; user-select: none; }
    #osd { position: absolute; inset: 0; pointer-events: none; }
    .top { position: absolute; top: 92px; left: 22px; right: 22px; padding: 14px 18px; border: 1px solid rgba(132, 220, 255, .62); border-radius: 12px; background: linear-gradient(90deg, rgba(5, 15, 25, .83), rgba(21, 72, 91, .55)); box-shadow: 0 8px 28px rgba(0, 0, 0, .34); }
    .title { font-size: 20px; font-weight: 720; letter-spacing: .01em; }
    .subtitle { margin-top: 4px; color: #bcecff; }
    .pause { position: absolute; left: 50%; top: 50%; translate: -50% -50%; width: 88px; height: 88px; border-radius: 50%; background: rgba(3, 12, 20, .68); border: 2px solid rgba(255,255,255,.76); display: grid; place-items: center; box-shadow: 0 10px 36px rgba(0,0,0,.4); }
    .pause::before { content: ''; width: 27px; height: 38px; border-left: 11px solid white; border-right: 11px solid white; }
    .bottom { position: absolute; left: 22px; right: 22px; bottom: 22px; padding: 15px 18px 17px; border-radius: 13px; background: rgba(4, 13, 22, .82); border: 1px solid rgba(255,255,255,.2); box-shadow: 0 -8px 28px rgba(0,0,0,.25); }
    .row { display: flex; align-items: center; gap: 12px; }
    button { pointer-events: auto; appearance: none; border: 1px solid #9ce8ff; border-radius: 9px; padding: 9px 14px; color: #05131c; background: #8be5ff; font-weight: 750; cursor: pointer; }
    button:hover, button:focus-visible { background: white; outline: 3px solid rgba(139, 229, 255, .36); }
    #seek { pointer-events: auto; position: relative; flex: 1; height: 18px; border-radius: 9px; background: rgba(255,255,255,.24); cursor: pointer; outline: none; }
    #seek::before { content: ''; position: absolute; inset: 4px 42% 4px 4px; border-radius: 5px; background: linear-gradient(90deg, #53d6ff, #85ffc7); }
    #seek:hover, #seek:focus-visible { box-shadow: 0 0 0 3px rgba(139, 229, 255, .38); }
    #status { min-width: 135px; color: #c8d7e5; text-align: right; }
  </style>
</head>
<body>
  <div id="osd">
    <section class="top">
      <div class="title">HTML OSD above native mpv video</div>
      <div class="subtitle">Transparent Chromium BrowserWindow · window-level composition</div>
    </section>
    <div class="pause" aria-label="Central pause icon"></div>
    <section class="bottom">
      <div class="row">
        <button id="probe" data-interactive type="button">OSD button</button>
        <div id="seek" data-interactive role="slider" aria-label="Seek area" aria-valuemin="0" aria-valuemax="100" aria-valuenow="58" tabindex="0"></div>
        <div id="status">Starting</div>
      </div>
    </section>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
